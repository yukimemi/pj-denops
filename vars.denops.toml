# Denops-layer action version pins. Merged into the consumer's
# `.kata/vars.toml` via `[[file]] how = "merge-toml"`, composing
# with pj-base's universal pins (actions/checkout,
# peter-evans/create-pull-request, anthropics/claude-code-action).
#
# Each `# renovate:` annotation tells Renovate which datasource and
# upstream repo the value tracks; Renovate bumps these via the
# customManager declared in pj-base's `default.json`. Bumps land in
# this template repo's source file and in each consumer's
# `.kata/vars.toml` independently.

[actions]
# renovate: datasource=github-tags depName=denoland/setup-deno
deno_setup = "v2"
# renovate: datasource=github-tags depName=rhysd/action-setup-vim
rhysd_action_setup_vim = "v1"
# renovate: datasource=github-tags depName=thinca/action-setup-vim
thinca_action_setup_vim = "v3"

[denops]
# Editor versions the CI matrix installs. `@denops/test` spawns REAL
# vim / nvim binaries, so a denops plugin's suite cannot run without
# them — this is the reason the denops layer ships its own CI matrix
# instead of reusing a plain "setup-deno + deno task ci" workflow.
#
# renovate: datasource=github-releases depName=vim/vim-win32-installer
vim_version = "v9.2.0148"
# renovate: datasource=github-releases depName=neovim/neovim
nvim_version = "v0.12.5"